// Cấu hình repository cho Gradle
pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.name = "CoCaro"

// Khai báo module app, nằm trong thư mục src/app
// (Workflow GitHub Actions chạy Gradle từ thư mục gốc repo)
include ':app'
project(':app').projectDir = new File(rootDir, 'src/app')