# Cấu hình AndroidX và tối ưu build
# LƯU Ý: Workflow GitHub Actions chạy Gradle tại thư mục GỐC repo,
# nên file này bắt buộc phải nằm ở gốc để Gradle đọc được (bản trong src/ bị bỏ qua).
android.useAndroidX=true
# Tắt Jetifier: app chỉ dùng AndroidX thuần (appcompat), không có thư viện
# support-lib cũ. Jetifier đã deprecated và là nguyên nhân phổ biến gây lỗi
# checkDebugDuplicateClasses trên AGP 8.x.
android.enableJetifier=false
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
