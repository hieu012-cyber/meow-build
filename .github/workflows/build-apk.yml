name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      - name: Cài JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cài Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build APK (debug)
        working-directory: ./android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Đổi tên APK
        run: |
          mkdir -p build-out
          find android/app/build/outputs/apk -name '*.apk' -exec cp {} build-out/utility-hub-debug.apk \;
          ls -lh build-out/

      - name: Tải APK lên (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: utility-hub-debug-apk
          path: build-out/utility-hub-debug.apk
          retention-days: 30
