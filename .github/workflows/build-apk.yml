name: Build Android APK
on:
  push:
    branches: [ '**' ]
  workflow_dispatch:

env:
  APK_NAME: "CoCaro-Meow"
  VERSION_MAJOR_MINOR: "1.0"
  VERSION_CODE_OFFSET: "0"
  APPEND_VERSION: "true"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Kiểm tra trước khi build (Preflight)
        run: |
          echo "=== PREFLIGHT CHECK (BUILD_AUDIT_UI 1.2 & 1.4) ==="
          java -version 2>&1
          echo "ANDROID_HOME=${ANDROID_HOME}"
          MISSING=0
          if [ ! -f "settings.gradle" ] && [ ! -f "settings.gradle.kts" ]; then
            echo "::error::Thiếu settings.gradle hoặc settings.gradle.kts tại thư mục chạy Gradle"
            MISSING=1
          fi
          if [ ! -f "build.gradle" ] && [ ! -f "build.gradle.kts" ]; then
            echo "::error::Thiếu build.gradle hoặc build.gradle.kts gốc"
            MISSING=1
          fi
          if [ ! -f "gradle.properties" ]; then
            echo "android.useAndroidX=true" > gradle.properties
            echo "Đã tự bổ sung gradle.properties (android.useAndroidX=true)"
          elif ! grep -q "android.useAndroidX=true" gradle.properties; then
            echo "" >> gradle.properties
            echo "android.useAndroidX=true" >> gradle.properties
            echo "Đã bổ sung android.useAndroidX=true vào gradle.properties"
          fi
          if [ ! -f "app/build.gradle" ] && [ ! -f "app/build.gradle.kts" ]; then
            echo "::error::Thiếu module app/build.gradle hoặc app/build.gradle.kts"
            MISSING=1
          fi
          if [ ! -f "app/src/main/AndroidManifest.xml" ] && [ ! -f "AndroidManifest.xml" ]; then
            echo "::error::Thiếu app/src/main/AndroidManifest.xml"
            MISSING=1
          fi
          if [ ! -f "./gradlew" ]; then
            echo "Chưa có gradlew, đang tạo Gradle Wrapper 8.7..."
            gradle wrapper --gradle-version 8.7
          fi
          chmod +x gradlew
          ./gradlew --version | head -n 15
          if [ "$MISSING" -ne 0 ]; then
            echo "::error::Preflight thất bại: Thiếu các file cấu hình bắt buộc ở trên."
            exit 1
          fi

      - name: Tính phiên bản
        run: |
          VERSION_CODE=$(( VERSION_CODE_OFFSET + GITHUB_RUN_NUMBER ))
          VERSION_NAME="${VERSION_MAJOR_MINOR}.${GITHUB_RUN_NUMBER}"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          if [ "$APPEND_VERSION" = "true" ]; then
            FINAL_NAME="${APK_NAME}-v${VERSION_NAME}"
          else
            FINAL_NAME="${APK_NAME}"
          fi
          echo "FINAL_APK_NAME=$FINAL_NAME" >> "$GITHUB_ENV"
          echo "Phiên bản: $VERSION_NAME (versionCode: $VERSION_CODE), tên APK: $FINAL_NAME.apk"

      - name: Chuẩn bị chữ ký cố định
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "Đang giải mã keystore cố định từ GitHub Secrets..."
            mkdir -p "$HOME/.android"
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$HOME/.android/debug.keystore"
            echo "HAS_KEYSTORE=true" >> "$GITHUB_ENV"
            echo "Đã thiết lập chữ ký app cố định (~/.android/debug.keystore)."
          else
            echo "HAS_KEYSTORE=false" >> "$GITHUB_ENV"
            echo "THÔNG BÁO: Chưa cấu hình KEYSTORE_BASE64 trong GitHub Secrets. Đang dùng khoá debug mặc định của máy chủ."
          fi

      - name: Build Android APK
        run: |
          set -o pipefail
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew assembleDebug -PversionCode=$VERSION_CODE -PversionName=$VERSION_NAME --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Đưa lỗi thật lên annotation
        if: failure()
        run: |
          if [ -f "build.log" ]; then
            if grep -q "What went wrong" build.log; then
              grep -A 12 "What went wrong" build.log | head -n 30 | sed 's/^/::error::/'
            else
              tail -n 30 build.log | sed 's/^/::error::/'
            fi
          fi

      - name: Lưu log lỗi
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: src/build.log
          if-no-files-found: ignore

      - name: Đặt tên APK
        run: |
          APK=$(find . -path "*/build/outputs/apk/debug/*.apk" 2>/dev/null | head -n 1)
          if [ -z "$APK" ]; then
            APK=$(find . -path "*/build/outputs/apk/*.apk" 2>/dev/null | head -n 1)
          fi
          if [ -z "$APK" ]; then
            APK=$(find . -name "*.apk" 2>/dev/null | head -n 1)
          fi
          if [ -z "$APK" ]; then
            echo "LỖI: Không tìm thấy file APK nào sau khi build!"
            exit 1
          fi
          echo "Tìm thấy file APK gốc tại: $APK"
          mkdir -p dist
          cp "$APK" "dist/${FINAL_APK_NAME}.apk"
          echo "Đã tạo APK xuất bản: dist/${FINAL_APK_NAME}.apk"

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: ${{ env.FINAL_APK_NAME }}
          path: src/dist/${{ env.FINAL_APK_NAME }}.apk
          if-no-files-found: error
