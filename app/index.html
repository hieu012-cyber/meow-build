<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0b1120">
    <title>Utility Hub - Máy Tính, Đồng Hồ, Thời Tiết</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app">
        <header class="app-header">
            <h1><i class="fa-solid fa-cubes"></i> Utility Hub</h1>
            <p>Bộ công cụ tiện ích nhỏ gọn của bạn</p>
        </header>

        <nav class="tabs" role="tablist">
            <button class="tab active" data-tab="calc" role="tab" aria-selected="true">
                <i class="fa-solid fa-calculator"></i> Máy Tính
            </button>
            <button class="tab" data-tab="clock" role="tab" aria-selected="false">
                <i class="fa-regular fa-clock"></i> Đồng Hồ
            </button>
            <button class="tab" data-tab="weather" role="tab" aria-selected="false">
                <i class="fa-solid fa-cloud-sun"></i> Thời Tiết
            </button>
        </nav>

        <main class="panels">
            <section id="calc" class="panel active" role="tabpanel">
                <div class="calc-display">
                    <div class="calc-history" id="calc-history"></div>
                    <div class="calc-value" id="calc-value">0</div>
                </div>
                <div class="calc-keys">
                    <button class="key key-fn" data-action="clear">C</button>
                    <button class="key key-fn" data-action="sign">±</button>
                    <button class="key key-fn" data-action="percent">%</button>
                    <button class="key key-op" data-op="/">÷</button>
                    <button class="key" data-num="7">7</button>
                    <button class="key" data-num="8">8</button>
                    <button class="key" data-num="9">9</button>
                    <button class="key key-op" data-op="*">×</button>
                    <button class="key" data-num="4">4</button>
                    <button class="key" data-num="5">5</button>
                    <button class="key" data-num="6">6</button>
                    <button class="key key-op" data-op="-">−</button>
                    <button class="key" data-num="1">1</button>
                    <button class="key" data-num="2">2</button>
                    <button class="key" data-num="3">3</button>
                    <button class="key key-op" data-op="+">+</button>
                    <button class="key key-zero" data-num="0">0</button>
                    <button class="key" data-action="dot">.</button>
                    <button class="key key-equals" data-action="equals">=</button>
                </div>
            </section>

            <section id="clock" class="panel" role="tabpanel">
                <div class="clock-wrap">
                    <div class="clock-time" id="clock-time">00:00:00</div>
                    <div class="clock-date" id="clock-date"></div>
                </div>
                <div class="stopwatch">
                    <h3><i class="fa-solid fa-stopwatch"></i> Bấm Giờ</h3>
                    <div class="sw-time" id="sw-time">00:00.00</div>
                    <div class="sw-buttons">
                        <button class="btn btn-primary" id="sw-start">Bắt đầu</button>
                        <button class="btn btn-ghost" id="sw-lap" disabled>Vòng</button>
                        <button class="btn btn-ghost" id="sw-reset">Đặt lại</button>
                    </div>
                    <ul class="sw-laps" id="sw-laps"></ul>
                </div>
            </section>

            <section id="weather" class="panel" role="tabpanel">
                <form class="weather-search" id="weather-form">
                    <input type="text" id="weather-city" placeholder="Nhập tên thành phố (vd: Hà Nội)" autocomplete="off">
                    <button type="submit" class="btn btn-primary" aria-label="Tìm">
                        <i class="fa-solid fa-magnifying-glass"></i>
                    </button>
                </form>
                <div class="weather-card" id="weather-card">
                    <div class="weather-main">
                        <i class="fa-solid fa-cloud-sun weather-icon"></i>
                        <div>
                            <div class="weather-temp">--°</div>
                            <div class="weather-desc">Nhập thành phố để xem thời tiết</div>
                        </div>
                    </div>
                    <div class="weather-details">
                        <div class="w-detail">
                            <i class="fa-solid fa-droplet"></i>
                            <span class="w-label">Độ ẩm</span>
                            <strong class="w-humidity">--%</strong>
                        </div>
                        <div class="w-detail">
                            <i class="fa-solid fa-wind"></i>
                            <span class="w-label">Gió</span>
                            <strong class="w-wind">-- km/h</strong>
                        </div>
                        <div class="w-detail">
                            <i class="fa-solid fa-temperature-half"></i>
                            <span class="w-label">Cảm giác</span>
                            <strong class="w-feels">--°</strong>
                        </div>
                    </div>
                </div>
                <p class="weather-note">
                    <i class="fa-solid fa-circle-info"></i>
                    Bản demo dùng dữ liệu mô phỏng. Muốn dữ liệu thật, cần thêm API key OpenWeatherMap.
                </p>
            </section>
        </main>

        <footer class="app-footer">
            <a href="../index.html"><i class="fa-solid fa-arrow-left"></i> Về trang chủ MeowCode</a>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
