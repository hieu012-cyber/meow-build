// Cấu hình module app - Cờ Caro Meow
plugins {
    id 'com.android.application'
}

// Nhận versionCode/versionName từ workflow qua -P (nếu không có thì dùng mặc định)
def buildVersionCode = (project.hasProperty('versionCode') ? project.property('versionCode') : "1").toInteger()
def buildVersionName = project.hasProperty('versionName') ? "${project.property('versionName')}" : "1.0"

android {
    namespace 'com.meowcode.cocaro'
    compileSdk 34

    defaultConfig {
        applicationId "com.meowcode.cocaro"
        minSdk 21
        targetSdk 34
        versionCode buildVersionCode
        versionName buildVersionName
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Ép phiên bản Kotlin stdlib đồng nhất.
// Từ Kotlin 1.8, các artifact kotlin-stdlib-jdk7/jdk8 đã được gộp vào
// kotlin-stdlib, nên nếu bị kéo về bản cũ (1.6.21) sẽ trùng class và gây lỗi
// :app:checkDebugDuplicateClasses (Duplicate class kotlin.collections...).
configurations.all {
    resolutionStrategy {
        force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    // Khai báo tường minh để Gradle không kéo bản stdlib cũ qua đường phụ thuộc
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
}
